                            <!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>บริหารโครงการจัดงานศพ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: #f5f0eb;
      color: #333;
      min-height: 100vh;
    }
    header {
      background: #4a3728;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }
    #connection-status {
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
    }
    .toolbar {
      padding: 12px 24px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      background: #ede8e3;
      border-bottom: 1px solid #d4c9be;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .btn-primary   { background: #4a3728; color: white; }
    .btn-secondary { background: #8d6e63; color: white; }
    .btn-success   { background: #388e3c; color: white; }
    .btn-danger    { background: #c62828; color: white; }
    .btn-sm { padding: 4px 10px; font-size: 0.8rem; }

    main { padding: 20px 24px; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white;
      border-radius: 10px;
      padding: 24px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .modal h2 { margin-bottom: 16px; color: #4a3728; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.9rem; }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

    /* Task Cards */
    .board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .task-card {
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-left: 4px solid #ccc;
    }
    .task-card.status-pending  { border-left-color: #f9a825; }
    .task-card.status-progress { border-left-color: #1976d2; }
    .task-card.status-done     { border-left-color: #388e3c; }
    .task-card.status-blocked  { border-left-color: #c62828; }

    .task-title { font-weight: 700; font-size: 1rem; margin-bottom: 6px; }
    .task-meta  { font-size: 0.82rem; color: #666; margin-bottom: 4px; }
    .task-note  { font-size: 0.85rem; color: #555; margin-top: 8px; background: #f9f6f3; padding: 6px 8px; border-radius: 4px; }
    .task-actions { margin-top: 12px; display: flex; gap: 8px; }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
      color: white;
    }
    .badge-pending  { background: #f9a825; color: #333; }
    .badge-progress { background: #1976d2; }
    .badge-done     { background: #388e3c; }
    .badge-blocked  { background: #c62828; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      font-size: 1rem;
      grid-column: 1/-1;
    }

    #btn-add-task {
      position: fixed;
      bottom: 28px; right: 28px;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #4a3728;
      color: white;
      font-size: 1.8rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      z-index: 50;
    }

    @media print {
      header, .toolbar, #btn-add-task, .task-actions, .modal-overlay { display: none !important; }
      body { background: white; }
      .task-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; margin-bottom: 12px; }
    }
  </style>
</head>
<body>

<header>
  <h1>🪷 บริหารงานศพ</h1>
  <span id="connection-status">⏳ กำลังเชื่อมต่อ...</span>
</header>

<!-- ✅ ลบ panel กรอก Firebase URL ออกทั้งหมด -->

<div class="toolbar">
  <button class="btn-secondary" onclick="exportJSON()">⬇ ส่งออก JSON</button>
  <button class="btn-secondary" onclick="window.print()">🖨 พิมพ์</button>
</div>

<!-- Modal เพิ่ม/แก้ไขงาน -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">แก้ไขงาน</h2>
    <div class="form-group">
      <label>ชื่องาน</label>
      <input type="text" id="f-title" placeholder="เช่น จัดเตรียมสถานที่" />
    </div>
    <div class="form-group">
      <label>ผู้รับผิดชอบ</label>
      <input type="text" id="f-assignee" placeholder="ชื่อผู้รับผิดชอบ" />
    </div>
    <div class="form-group">
      <label>สถานะ</label>
      <select id="f-status">
        <option value="pending">รอดำเนินการ</option>
        <option value="progress">กำลังดำเนินการ</option>
        <option value="done">เสร็จแล้ว</option>
        <option value="blocked">ติดขัด</option>
      </select>
    </div>
    <div class="form-group">
      <label>หมายเหตุ</label>
      <textarea id="f-note" placeholder="รายละเอียดเพิ่มเติม..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-success"   onclick="saveTask()">บันทึก</button>
    </div>
  </div>
</div>

<main>
  <div class="board" id="board">
    <div class="empty-state">⏳ กำลังโหลดข้อมูล...</div>
  </div>
</main>

<button id="btn-add-task" title="เพิ่มงาน" onclick="openModal()">+</button>

<script>
  // ✅ ฝัง URL ตายตัว ไม่ต้องให้ผู้ใช้กรอก
  const FIREBASE_URL = "https://funeral-project-b36ca-default-rtdb.asia-southeast1.firebasedatabase.app";

  let tasks      = {};
  let editingId  = null;
  let pollTimer  = null;

  // =========================================================
  // ✅ เชื่อมต่ออัตโนมัติ
  // =========================================================
  async function initFirebase() {
    try {
      const res = await fetch(`${FIREBASE_URL}/tasks.json`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      tasks = (data && typeof data === "object") ? data : {};
      setStatus(true);
      renderBoard();
      // เริ่ม polling real-time
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(syncFromFirebase, 5000);
    } catch (err) {
      setStatus(false);
      document.getElementById("board").innerHTML =
        '<div class="empty-state">❌ เชื่อมต่อ Firebase ไม่สำเร็จ กรุณารีเฟรชหน้า</div>';
      console.error("Firebase Error:", err);
    }
  }

  // =========================================================
  // Polling sync
  // =========================================================
  async function syncFromFirebase() {
    try {
      const res = await fetch(`${FIREBASE_URL}/tasks.json`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      tasks = (data && typeof data === "object") ? data : {};
      setStatus(true);
      renderBoard();
    } catch (err) {
      setStatus(false);
      console.warn("Sync ล้มเหลว:", err.message);
    }
  }

  // =========================================================
  // Firebase REST
  // =========================================================
  async function writeTask(id, taskData) {
    const res = await fetch(`${FIREBASE_URL}/tasks/${id}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(taskData)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  }

  async function removeTask(id) {
    const res = await fetch(`${FIREBASE_URL}/tasks/${id}.json`, { method: "DELETE" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  }

  // =========================================================
  // UI Status
  // =========================================================
  function setStatus(ok) {
    document.getElementById("connection-status").textContent =
      ok ? "🟢 เชื่อมต่อแล้ว" : "🔴 การเชื่อมต่อขัดข้อง";
  }

  // =========================================================
  // Render
  // =========================================================
  const STATUS_LABEL = {
    pending:  "รอดำเนินการ",
    progress: "กำลังดำเนินการ",
    done:     "เสร็จแล้ว",
    blocked:  "ติดขัด"
  };

  function renderBoard() {
    const board = document.getElementById("board");
    const ids   = Object.keys(tasks);
    if (!ids.length) {
      board.innerHTML = '<div class="empty-state">📋 ยังไม่มีงาน — กด <b>+</b> เพื่อเพิ่มงาน</div>';
      return;
    }
    board.innerHTML = ids.map(id => {
      const t  = tasks[id];
      const st = t.status || "pending";
      return `
        <div class="task-card status-${st}">
          <div class="task-title">${esc(t.title || "(ไม่มีชื่อ)")}</div>
          <div class="task-meta">👤 ${esc(t.assignee || "-")}</div>
          <div class="task-meta">
            <span class="badge badge-${st}">${STATUS_LABEL[st] || st}</span>
          </div>
          ${t.note ? `<div class="task-note">📝 ${esc(t.note)}</div>` : ""}
          <div class="task-actions">
            <button class="btn-primary btn-sm"  onclick="openModal('${id}')">✏️ แก้ไข</button>
            <button class="btn-danger  btn-sm"  onclick="confirmDelete('${id}')">🗑 ลบ</button>
          </div>
        </div>`;
    }).join("");
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // =========================================================
  // Modal
  // =========================================================
  function openModal(id = null) {
    editingId = id;
    document.getElementById("modal-title").textContent = id ? "แก้ไขงาน" : "เพิ่มงานใหม่";
    const t = id && tasks[id] ? tasks[id] : {};
    document.getElementById("f-title").value    = t.title    || "";
    document.getElementById("f-assignee").value = t.assignee || "";
    document.getElementById("f-status").value   = t.status   || "pending";
    document.getElementById("f-note").value     = t.note     || "";
    document.getElementById("modal-overlay").classList.add("active");
  }

  function closeModal() {
    document.getElementById("modal-overlay").classList.remove("active");
    editingId = null;
  }

  // =========================================================
  // Save / Delete
  // =========================================================
  async function saveTask() {
    const title    = document.getElementById("f-title").value.trim();
    const assignee = document.getElementById("f-assignee").value.trim();
    const status   = document.getElementById("f-status").value;
    const note     = document.getElementById("f-note").value.trim();

    if (!title) { alert("กรุณากรอกชื่องาน"); return; }

    const id       = editingId || `task_${Date.now()}`;
    const taskData = { title, assignee, status, note, updatedAt: Date.now() };

    try {
      await writeTask(id, taskData);
      tasks[id] = taskData;
      renderBoard();
      closeModal();
    } catch (err) {
      alert("❌ บันทึกไม่สำเร็จ: " + err.message);
    }
  }

  async function confirmDelete(id) {
    if (!confirm(`ลบงาน "${tasks[id]?.title || id}" ?`)) return;
    try {
      await removeTask(id);
      delete tasks[id];
      renderBoard();
    } catch (err) {
      alert("❌ ลบไม่สำเร็จ: " + err.message);
    }
  }

  // =========================================================
  // Export
  // =========================================================
  function exportJSON() {
    const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: "application/json" });
    const a    = document.createElement("a");
    a.href     = URL.createObjectURL(blob);
    a.download = `funeral_tasks_${Date.now()}.json`;
    a.click();
  }

  // ✅ เริ่มทำงานอัตโนมัติทันทีที่หน้าโหลด
  window.addEventListener("DOMContentLoaded", initFirebase);
</script>
</body>
</html>
