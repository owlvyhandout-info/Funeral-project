<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>งานกรณีศึกษารายการที่ต้องเตรียมล่วงหน้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e8e4dc;
    --border-strong: #ccc8be;
    --text: #1a1917;
    --text-muted: #6b6760;
    --text-hint: #a09d96;
    --gold: #8b6914;
    --gold-light: #f5edda;
    --gold-border: #d4af5a;
    --blue: #185FA5;
    --blue-light: #E6F1FB;
    --green: #3B6D11;
    --green-light: #EAF3DE;
    --red: #A32D2D;
    --red-light: #FCEBEB;
    --amber: #854F0B;
    --amber-light: #FAEEDA;
    --purple: #534AB7;
    --purple-light: #EEEDFE;
    --radius: 10px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-icon {
    width: 30px;
    height: 30px;
    background: var(--gold-light);
    border: 1px solid var(--gold-border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .brand-name {
    font-family: 'Noto Serif Thai', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.01em;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #syncStatus {
    font-size: 12px;
    color: var(--text-hint);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .sync-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ccc;
    flex-shrink: 0;
  }

  .sync-dot.live { background: #3B6D11; }
  .sync-dot.saving { background: #854F0B; animation: pulse 1s infinite; }
  .sync-dot.error { background: #A32D2D; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  main { max-width: 800px; margin: 0 auto; padding: 20px 24px 60px; }

  .summary-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    text-align: center;
  }

  .stat-num { font-size: 22px; font-weight: 600; }
  .stat-lbl { font-size: 11px; color: var(--text-hint); margin-top: 2px; }

  .phase {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
  }

  .phase-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    background: #fdfcfa;
    border-bottom: 1px solid var(--border);
  }

  .phase-header:hover { background: #f8f6f2; }

  .phase-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .phase-title { font-weight: 600; font-size: 14px; flex: 1; }

  .phase-prog { font-size: 12px; color: var(--text-hint); }

  .phase-chev {
    font-size: 13px;
    color: var(--text-hint);
    transition: transform 0.2s;
  }

  .phase-chev.open { transform: rotate(180deg); }

  .tasks { display: none; }
  .tasks.open { display: block; }

  .task-row {
    display: grid;
    grid-template-columns: 28px 1fr auto 32px;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    transition: background 0.1s;
  }

  .task-row:hover { background: #fdfcfa; }

  .task-idx { font-size: 11px; color: var(--text-hint); text-align: center; }

  .task-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; }

  .task-owner { font-size: 11px; color: var(--text-muted); }

  .task-note { font-size: 11px; color: var(--text-hint); font-style: italic; margin-top: 2px; }

  .task-doc { 
    font-size: 11px; 
    color: var(--amber); 
    background: var(--amber-light); 
    border: 1px solid #f2e3c6;
    padding: 4px 8px; 
    border-radius: 4px; 
    display: inline-block;
    margin-top: 4px;
    max-width: 100%; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
    vertical-align: top;
  }

  .task-doc.empty {
    color: var(--text-hint);
    background: transparent;
    border: 1px dashed var(--border-strong);
  }

  /* ปุ่มลิงก์ที่เพิ่มมาใหม่ในหน้าหลัก */
  .task-link-badge {
    font-size: 11px;
    color: var(--blue);
    background: var(--blue-light);
    border: 1px solid #cce0f5;
    padding: 4px 8px;
    border-radius: 4px;
    display: inline-block;
    margin-top: 4px;
    margin-left: 4px;
    text-decoration: none;
    vertical-align: top;
  }
  
  .task-link-badge:hover { background: #dbeafe; }

  .status-btn {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    font-family: 'Sarabun', sans-serif;
    white-space: nowrap;
    font-weight: 500;
  }

  .s-todo { background: #F1EFE8; color: #5F5E5A; }
  .s-doing { background: var(--blue-light); color: var(--blue); }
  .s-done { background: var(--green-light); color: var(--green); }
  .s-blocked { background: var(--red-light); color: var(--red); }

  .edit-btn {
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--text-hint);
  }

  .edit-btn:hover { background: var(--bg); color: var(--text-muted); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 20px;
    width: 360px;
    max-width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: var(--gold); }

  .field { margin-bottom: 12px; }

  .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }

  .field input, .field select, .field textarea {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--gold-border);
  }

  .field textarea { height: 60px; resize: vertical; }

  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  .btn-cancel {
    padding: 8px 18px;
    border: 1px solid var(--border-strong);
    background: transparent;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: 'Sarabun', sans-serif;
    cursor: pointer;
    color: var(--text-muted);
  }

  .btn-save {
    padding: 8px 18px;
    border: none;
    background: var(--gold);
    color: #fff;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: 'Sarabun', sans-serif;
    cursor: pointer;
    font-weight: 500;
  }

  .btn-save:hover { background: #7a5c10; }

  .top-actions { display: flex; justify-content: flex-end; margin-bottom: 14px; gap: 8px; }

  .btn-export {
    padding: 7px 14px;
    border: 1px solid var(--border-strong);
    background: transparent;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-family: 'Sarabun', sans-serif;
    cursor: pointer;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .btn-export:hover { background: var(--bg); }

  .last-update { font-size: 11px; color: var(--text-hint); text-align: right; margin-bottom: 10px; }

  @media (max-width: 500px) {
    .summary-bar { grid-template-columns: repeat(2, 1fr); }
    header { padding: 0 14px; }
    main { padding: 14px 14px 60px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">🪷</div>
    <span class="brand-name">บริหารงาน จัดทำโดยครอบครัว</span>
  </div>
  <div class="header-right">
    <div id="syncStatus">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">ยังไม่เชื่อมต่อ</span>
    </div>
  </div>
</header>

<main>
  <div class="summary-bar" id="summaryBar"></div>
  <div class="last-update" id="lastUpdate"></div>
  <div class="top-actions">
    <button class="btn-export" onclick="exportJSON()">⬇ ส่งออก JSON</button>
    <button class="btn-export" onclick="printPage()">🖨 พิมพ์</button>
  </div>
  <div id="phaseList"></div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">แก้ไขงาน</h3>
    <div class="field"><label>ชื่องาน</label><input id="fName" type="text"></div>
    <div class="field"><label>ผู้รับผิดชอบ</label><input id="fOwner" type="text"></div>
    <div class="field"><label>สถานะ</label>
      <select id="fStatus">
        <option value="todo">รอดำเนินการ</option>
        <option value="doing">กำลังดำเนินการ</option>
        <option value="done">เสร็จแล้ว</option>
        <option value="blocked">ติดขัด</option>
      </select>
    </div>
    <div class="field"><label>เอกสาร/ประเด็นสำคัญ (จัดเตรียมล่วงหน้า)</label><textarea id="fDoc" placeholder="เช่น บัตรประชาชน, ทะเบียนบ้าน..."></textarea></div>
    
    <div class="field"><label>แนบลิงก์เอกสาร (Google Drive, URL ฯลฯ)</label><input id="fLink" type="url" placeholder="https://..."></div>

    <div class="field"><label>หมายเหตุ</label><textarea id="fNote"></textarea></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-save" onclick="saveModal()">บันทึก</button>
    </div>
  </div>
</div>

<script>
// เพิ่ม link:'' ให้กับข้อมูลทุกตัว
const DEFAULT_PHASES = [
  {id:'p1', label:'ที่โรงพยาบาล', color:'#185FA5', tasks:[
    {id:'t01', name:'รับใบรับรองการตายจากแพทย์', owner:'ญาติผู้ใหญ่ / หัวหน้าครอบครัว', status:'todo', doc:'', link:'', note:'ต้องได้รับก่อนทำขั้นตอนอื่น'},
    {id:'t02', name:'รับสิ่งของส่วนตัวผู้เสียชีวิต', owner:'ญาติผู้ใหญ่', status:'todo', doc:'', link:'', note:''},
    {id:'t03', name:'ติดต่อห้องเก็บศพ / ย้ายร่าง', owner:'พยาบาล + ญาติ', status:'todo', doc:'', link:'', note:''},
    {id:'t04', name:'ติดต่อและนัดรถรับศพ', owner:'ผู้ประสานงาน', status:'todo', doc:'', link:'', note:'โรงพยาบาลมักมีรายชื่อแนะนำ'},
  ]},
  {id:'p2', label:'แจ้งหน่วยงานราชการ', color:'#3B6D11', tasks:[
    {id:'t05', name:'แจ้งสำนักทะเบียน (เขต/อำเภอ/เทศบาล)', owner:'ญาติผู้ใหญ่', status:'todo', doc:'', link:'', note:'ภายใน 24 ชั่วโมง'},
    {id:'t06', name:'รับใบมรณบัตร (ม.6)', owner:'ญาติผู้ใหญ่', status:'todo', doc:'', link:'', note:'นำใบรับรองแพทย์ + บัตรปชช + ทะเบียนบ้าน'},
    {id:'t07', name:'รับใบอนุญาตทำการศพ', owner:'ญาติผู้ใหญ่', status:'todo', doc:'', link:'', note:'ห้ามเผา/ฝังโดยไม่มีใบอนุญาต'},
    {id:'t08', name:'แจ้งประกันชีวิต / สิทธิ์สวัสดิการ', owner:'ผู้จัดการมรดก', status:'todo', doc:'', link:'', note:'ตรวจสอบกรมธรรม์และกำหนดส่งเอกสาร'},
  ]},
  {id:'p3', label:'ติดต่อวัดและเตรียมงาน', color:'#854F0B', tasks:[
    {id:'t09', name:'เลือกวัดและจองเมรุ', owner:'ผู้ประสานงาน', status:'todo', doc:'', link:'', note:'จองวันสวด / วันฌาปนกิจ'},
    {id:'t10', name:'นิมนต์พระสงฆ์', owner:'ผู้ประสานงาน', status:'todo', doc:'', link:'', note:'4–10 รูปต่อคืน'},
    {id:'t11', name:'สั่งโลงศพและดอกไม้', owner:'ผู้ประสานงาน', status:'todo', doc:'', link:'', note:''},
    {id:'t12', name:'เคลื่อนย้ายศพไปวัด', owner:'ผู้ประสานงาน + รถรับศพ', status:'todo', doc:'', link:'', note:'ต้องมีใบอนุญาตทำการศพแล้ว'},
    {id:'t13', name:'ประกาศแจ้งงานศพ / ส่ง LINE', owner:'ผู้ช่วย', status:'todo', doc:'', link:'', note:'แจ้งวัน เวลา สถานที่'},
    {id:'t14', name:'เตรียมอาหาร-น้ำดื่มรับแขก', owner:'ผู้ช่วย', status:'todo', doc:'', link:'', note:'ทุกคืนสวด + วันฌาปนกิจ'},
  ]},
  {id:'p4', label:'พิธีทางศาสนา', color:'#993C1D', tasks:[
    {id:'t15', name:'พิธีตั้งศพ / สวดมาติกา (วันแรก)', owner:'พระสงฆ์ + ครอบครัว', status:'todo', doc:'', link:'', note:''},
    {id:'t16', name:'สวดพระอภิธรรม (ทุกคืน)', owner:'พระสงฆ์ + ผู้ประสานงาน', status:'todo', doc:'', link:'', note:'ประมาณ 19.00–20.30 น.'},
    {id:'t17', name:'เลี้ยงพระเช้าวันฌาปนกิจ', owner:'ครอบครัว + ผู้ช่วย', status:'todo', doc:'', link:'', note:'สวดพุทธมนต์ + ถวายภัตตาหาร'},

    {id:'t19', name:'เก็บอัฐิ (วันรุ่งขึ้น)', owner:'ครอบครัว', status:'todo', doc:'', link:'', note:'บรรจุในผอบ / อัฐิ'},
  ]},
  {id:'p5', label:'โปรยอัฐิ', color:'#534AB7', tasks:[
    {id:'t20', name:'เลือกสถานที่โปรยอัฐิ', owner:'ครอบครัว', status:'todo', doc:'', link:'', note:'แม่น้ำ ทะเล หรือสถานที่พิเศษ'},
    {id:'t21', name:'ตรวจสอบข้อกำหนดท้องถิ่น', owner:'ผู้จัดการมรดก', status:'todo', doc:'', link:'', note:'บางพื้นที่ต้องขออนุญาต'},

    {id:'t23', name:'นิมนต์พระ / นำสวดมนต์ก่อนโปรย', owner:'ผู้ประสานงาน', status:'todo', doc:'', link:'', note:'ไม่บังคับแต่นิยมทำ'},
    {id:'t24', name:'ประกอบพิธีโปรยอัฐิ', owner:'ครอบครัว', status:'todo', doc:'', link:'', note:''},
  ]},
  {id:'p6', label:'ขั้นตอนหลังพิธี (กฎหมาย)', color:'#5F5E5A', tasks:[
    {id:'t25', name:'แจ้งถอนชื่อจากทะเบียนบ้าน', owner:'ญาติผู้ใหญ่', status:'todo', doc:'', link:'', note:'นำใบมรณบัตรไปที่สำนักงานเขต/อำเภอ'},
    {id:'t26', name:'แจ้งธนาคาร / ปิดบัญชี', owner:'ผู้จัดการมรดก', status:'todo', doc:'', link:'', note:'ต้องมีใบมรณบัตร + เอกสารมรดก'},
    {id:'t27', name:'ยื่นเรื่องมรดก / พินัยกรรม', owner:'ผู้จัดการมรดก / ทนาย', status:'todo', doc:'', link:'', note:'ภายใน 1 ปีนับจากวันเสียชีวิต'},
    {id:'t28', name:'คืน/ยกเลิกบัตรประชาชน / Passport', owner:'ญาติผู้ใหญ่', status:'todo', doc:'', link:'', note:'นำไปที่ว่าการอำเภอ'},
    {id:'t29', name:'แจ้งกองทุนบำเหน็จ / บำนาญ', owner:'ผู้จัดการมรดก', status:'todo', doc:'', link:'', note:'กบข. / ประกันสังคม / กองทุนสำรองเลี้ยงชีพ'},
  ]},
];

const STATUS_LABEL = {todo:'รอดำเนินการ', doing:'กำลังดำเนินการ', done:'เสร็จแล้ว', blocked:'ติดขัด'};
const STATUS_CLASS = {todo:'s-todo', doing:'s-doing', done:'s-done', blocked:'s-blocked'};
const STATUS_ORDER = ['todo','doing','done','blocked'];

let phases = JSON.parse(JSON.stringify(DEFAULT_PHASES));
let editingId = null;

// ฝัง Database URL ไว้ในโค้ดเลย ไม่ต้องใส่ทีหลัง
let fbBaseUrl = 'https://funeral-project-b36ca-default-rtdb.asia-southeast1.firebasedatabase.app';

let openPhases = {};
DEFAULT_PHASES.forEach(p => openPhases[p.id] = true);

function getTask(tid) {
  for (const p of phases) {
    const t = p.tasks.find(x => x.id === tid);
    if (t) return t;
  }
  return null;
}

function allTasks() { return phases.flatMap(p => p.tasks); }

function renderSummary() {
  const counts = {todo:0, doing:0, done:0, blocked:0};
  allTasks().forEach(t => counts[t.status]++);
  const colors = {todo:'#888', doing:'#185FA5', done:'#3B6D11', blocked:'#A32D2D'};
  document.getElementById('summaryBar').innerHTML = Object.entries(counts).map(([k,v]) =>
    `<div class="stat"><div class="stat-num" style="color:${colors[k]}">${v}</div><div class="stat-lbl">${STATUS_LABEL[k]}</div></div>`
  ).join('');
}

function renderPhases() {
  const list = document.getElementById('phaseList');
  list.innerHTML = phases.map(phase => {
    const done = phase.tasks.filter(t => t.status === 'done').length;
    const total = phase.tasks.length;
    const isOpen = openPhases[phase.id] !== false;
    return `<div class="phase">
      <div class="phase-header" onclick="togglePhase('${phase.id}')">
        <div class="phase-dot" style="background:${phase.color}"></div>
        <span class="phase-title">${phase.label}</span>
        <span class="phase-prog">${done}/${total}</span>
        <span class="phase-chev ${isOpen?'open':''}">▾</span>
      </div>
      <div class="tasks ${isOpen?'open':''}">
        ${phase.tasks.map((t, i) => `
        <div class="task-row" id="row_${t.id}">
          <span class="task-idx">${i+1}</span>
          <div style="min-width: 0;"> 
            <div class="task-name">${t.name}</div>
            <div class="task-owner">👤 ${t.owner}</div>
            ${t.note ? `<div class="task-note">${t.note}</div>` : ''}
            
            <div style="margin-top: 4px;">
              <div class="task-doc ${t.doc ? '' : 'empty'}" title="${t.doc || 'คลิก ✎ เพื่อเพิ่มเอกสาร/สิ่งที่ต้องเตรียม'}">
                📋 เตรียม: ${t.doc ? t.doc : 'ยังไม่ได้ระบุ...'}
              </div>
              
              ${t.link ? `<a href="${t.link}" target="_blank" class="task-link-badge" title="คลิกเพื่อเปิดเอกสารแนบ">🔗 เปิดลิงก์เอกสาร</a>` : ''}
            </div>

          </div>
          <button class="status-btn ${STATUS_CLASS[t.status]}" onclick="cycleStatus('${t.id}')" title="กดเพื่อเปลี่ยนสถานะ">${STATUS_LABEL[t.status]}</button>
          <button class="edit-btn" onclick="openModal('${t.id}')" title="แก้ไข">✎</button>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function togglePhase(pid) {
  openPhases[pid] = !openPhases[pid];
  renderPhases();
}

function cycleStatus(tid) {
  const t = getTask(tid);
  const idx = STATUS_ORDER.indexOf(t.status);
  t.status = STATUS_ORDER[(idx + 1) % STATUS_ORDER.length];
  renderPhases();
  renderSummary();
  saveToFirebase();
}

function openModal(tid) {
  const t = getTask(tid);
  editingId = tid;
  document.getElementById('modalTitle').textContent = 'แก้ไข: ' + t.name;
  document.getElementById('fName').value = t.name;
  document.getElementById('fOwner').value = t.owner;
  document.getElementById('fStatus').value = t.status;
  document.getElementById('fDoc').value = t.doc || '';
  document.getElementById('fLink').value = t.link || ''; 
  document.getElementById('fNote').value = t.note || '';
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  editingId = null;
}

function saveModal() {
  if (!editingId) return;
  const t = getTask(editingId);
  t.name = document.getElementById('fName').value;
  t.owner = document.getElementById('fOwner').value;
  t.status = document.getElementById('fStatus').value;
  t.doc = document.getElementById('fDoc').value;
  t.link = document.getElementById('fLink').value; 
  t.note = document.getElementById('fNote').value;
  closeModal();
  renderPhases();
  renderSummary();
  saveToFirebase();
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function setSyncStatus(state, text) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot ' + state;
  document.getElementById('syncText').textContent = text;
}

function setLastUpdate(ts) {
  if (!ts) return;
  const d = new Date(ts);
  document.getElementById('lastUpdate').textContent = 'อัปเดตล่าสุด: ' + d.toLocaleString('th-TH');
}

async function saveToFirebase() {
  if (!fbBaseUrl) return;
  setSyncStatus('saving', 'กำลังบันทึก...');
  try {
    const payload = { phases, updatedAt: Date.now() };
    const res = await fetch(fbBaseUrl + '/funeral_project.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    setSyncStatus('live', 'ซิงค์แล้ว');
  } catch (e) {
    setSyncStatus('error', 'บันทึกไม่สำเร็จ');
  }
}

async function loadFromFirebase() {
  if (!fbBaseUrl) return false;
  setSyncStatus('saving', 'กำลังโหลด...');
  try {
    const res = await fetch(fbBaseUrl + '/funeral_project.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.phases) {
      phases = data.phases;
      setLastUpdate(data.updatedAt);
    }
    setSyncStatus('live', 'เชื่อมต่อแล้ว');
    return true;
  } catch (e) {
    setSyncStatus('error', 'เชื่อมต่อไม่สำเร็จ');
    return false;
  }
}

function pollFirebase() {
  if (!fbBaseUrl) return;
  setInterval(async () => {
    try {
      const res = await fetch(fbBaseUrl + '/funeral_project.json');
      if (!res.ok) return;
      const data = await res.json();
      if (data && data.phases) {
        phases = data.phases;
        setLastUpdate(data.updatedAt);
        renderPhases();
        renderSummary();
        setSyncStatus('live', 'เชื่อมต่อแล้ว');
      }
    } catch (e) { setSyncStatus('error', 'หลุดการเชื่อมต่อ'); }
  }, 10000);
}

function exportJSON() {
  const blob = new Blob([JSON.stringify({phases, exportedAt: new Date().toISOString()}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'funeral_project_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function printPage() { window.print(); }

async function init() {
  if (fbBaseUrl) {
    // พยายามโหลดข้อมูลจากฐานข้อมูลทันที
    await loadFromFirebase();
    // สั่งให้ดึงข้อมูลอัปเดตตลอดเวลา
    pollFirebase();
  } else {
    setSyncStatus('', 'ยังไม่เชื่อมต่อ');
  }
  renderPhases();
  renderSummary();
}

init();
</script>
</body>
</html>
